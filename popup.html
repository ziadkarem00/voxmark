<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VoxMark AI Settings</title>
  <style>
    :root {
      --bg-dark: #090d16;
      --bg-card: rgba(22, 27, 46, 0.7);
      --bg-input: rgba(13, 17, 30, 0.85);
      --border: rgba(255, 255, 255, 0.1);
      --border-focus: rgba(99, 102, 241, 0.6);
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --accent-cyan: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --radius-sm: 8px;
      --radius-md: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg-dark);
      color: var(--text-main);
      padding: 16px;
      user-select: none;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-icon {
      width: 26px;
      height: 26px;
      border-radius: 8px;
      background: linear-gradient(135deg, #38bdf8, #6366f1);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 12px rgba(99, 102, 241, 0.4);
    }

    .brand-icon svg {
      width: 15px;
      height: 15px;
      fill: #ffffff;
    }

    .brand-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.3px;
      background: linear-gradient(135deg, #ffffff, #cbd5e1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .status-pill {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 9999px;
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.3);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .status-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 6px #4ade80;
    }

    /* Engine Mode Selector */
    .engine-tabs {
      display: flex;
      background: var(--bg-input);
      border-radius: var(--radius-sm);
      padding: 3px;
      border: 1px solid var(--border);
      margin-bottom: 14px;
    }

    .engine-tab {
      flex: 1;
      text-align: center;
      padding: 6px 0;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s ease;
    }

    .engine-tab.active {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.28), rgba(56, 189, 248, 0.18));
      color: #ffffff;
      border: 1px solid rgba(99, 102, 241, 0.4);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }

    /* Cards */
    .section-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px;
      margin-bottom: 12px;
      backdrop-filter: blur(12px);
    }

    .hidden {
      display: none !important;
    }

    .control-group {
      margin-bottom: 12px;
    }

    .control-group:last-child {
      margin-bottom: 0;
    }

    .control-label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 5px;
    }

    .control-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .control-val {
      font-size: 11px;
      font-weight: 700;
      color: var(--accent-cyan);
    }

    /* Inputs & Dropdowns */
    select, input[type="text"], input[type="password"] {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 7px 10px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      outline: none;
      transition: border-color 0.2s ease;
    }

    select:focus, input[type="text"]:focus, input[type="password"]:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
    }

    .input-with-btn {
      display: flex;
      gap: 6px;
      position: relative;
    }

    .toggle-pw-btn {
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text-muted);
      cursor: pointer;
      padding: 0 10px;
      border-radius: var(--radius-sm);
      font-size: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .toggle-pw-btn:hover {
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.25);
    }

    /* Range Sliders */
    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      background: transparent;
      margin: 4px 0;
    }

    input[type="range"]:focus {
      outline: none;
    }

    input[type="range"]::-webkit-slider-runnable-track {
      width: 100%;
      height: 4px;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 2px;
    }

    input[type="range"]::-webkit-slider-thumb {
      height: 14px;
      width: 14px;
      border-radius: 50%;
      background: var(--primary);
      cursor: pointer;
      -webkit-appearance: none;
      margin-top: -5px;
      box-shadow: 0 0 8px rgba(99, 102, 241, 0.8);
      transition: transform 0.1s ease;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    /* Helper text */
    .helper-text {
      font-size: 10px;
      color: #64748b;
      margin-top: 4px;
      line-height: 1.3;
    }

    /* Footer & Preview Button */
    .footer-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 12px;
    }

    .btn-preview {
      flex: 1;
      background: linear-gradient(135deg, #4f46e5, #6366f1);
      border: 1px solid rgba(165, 180, 252, 0.3);
      color: #ffffff;
      font-weight: 600;
      font-size: 12px;
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
      transition: all 0.2s ease;
    }

    .btn-preview:hover {
      background: linear-gradient(135deg, #4338ca, #4f46e5);
      box-shadow: 0 6px 16px rgba(99, 102, 241, 0.5);
      transform: translateY(-1px);
    }

    .btn-preview:active {
      transform: translateY(0);
    }

    .btn-stop-preview {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      font-size: 12px;
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-stop-preview:hover {
      background: rgba(239, 68, 68, 0.35);
    }

    .saved-toast {
      font-size: 10px;
      color: #a5b4fc;
      text-align: center;
      margin-top: 6px;
      min-height: 14px;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .saved-toast.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <div class="brand-group">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24">
          <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
        </svg>
      </div>
      <div class="brand-title">VoxMark AI</div>
    </div>
    <div class="status-pill">
      <div class="status-dot"></div>
      <span>Active</span>
    </div>
  </div>

  <!-- Engine Selection Tabs -->
  <div class="engine-tabs">
    <div class="engine-tab active" id="tab-native" data-engine="native">⚡ Native Browser</div>
    <div class="engine-tab" id="tab-openai" data-engine="openai">✨ OpenAI Cloud</div>
  </div>

  <!-- Native Settings Panel -->
  <div class="section-card" id="panel-native">
    <div class="control-group">
      <div class="control-label-row">
        <span class="control-label">System Voice</span>
      </div>
      <select id="select-native-voice">
        <option value="">Detecting natural voices...</option>
      </select>
    </div>
  </div>

  <!-- OpenAI Cloud Settings Panel -->
  <div class="section-card hidden" id="panel-openai">
    <div class="control-group">
      <div class="control-label-row">
        <span class="control-label">OpenAI API Key</span>
      </div>
      <div class="input-with-btn">
        <input type="password" id="input-openai-key" placeholder="sk-proj-..." spellcheck="false" autocomplete="off" />
        <button class="toggle-pw-btn" id="btn-toggle-key" title="Toggle visibility">👁️</button>
      </div>
      <div class="helper-text">Key is saved securely to your browser sync storage.</div>
    </div>

    <div class="control-group">
      <div class="control-label-row">
        <span class="control-label">Model</span>
      </div>
      <select id="select-openai-model">
        <option value="tts-1">tts-1 (Fast & Crisp)</option>
        <option value="tts-1-hd">tts-1-hd (Ultra High Fidelity)</option>
      </select>
    </div>

    <div class="control-group">
      <div class="control-label-row">
        <span class="control-label">AI Voice</span>
      </div>
      <select id="select-openai-voice">
        <option value="nova">Nova (Warm & energetic female)</option>
        <option value="alloy">Alloy (Neutral & balanced)</option>
        <option value="echo">Echo (Warm rounded male)</option>
        <option value="fable">Fable (Expressive British)</option>
        <option value="onyx">Onyx (Deep authoritative male)</option>
        <option value="shimmer">Shimmer (Clear & upbeat female)</option>
      </select>
    </div>
  </div>

  <!-- Common Speech Rate & Pitch Controls -->
  <div class="section-card">
    <div class="control-group">
      <div class="control-label-row">
        <span class="control-label">Speech Speed</span>
        <span class="control-val" id="val-rate">1.00x</span>
      </div>
      <input type="range" id="slider-rate" min="0.75" max="2.0" step="0.05" value="1.0" />
    </div>

    <div class="control-group" id="group-pitch">
      <div class="control-label-row">
        <span class="control-label">Pitch</span>
        <span class="control-val" id="val-pitch">1.00x</span>
      </div>
      <input type="range" id="slider-pitch" min="0.8" max="1.2" step="0.05" value="1.0" />
    </div>
  </div>

  <!-- Preview Actions -->
  <div class="footer-actions">
    <button class="btn-preview" id="btn-preview">
      <span>▶ Preview Voice</span>
    </button>
    <button class="btn-stop-preview hidden" id="btn-stop-preview">
      <span>⏹ Stop</span>
    </button>
  </div>

  <div class="saved-toast" id="saved-toast">Saved automatically</div>

  <script src="popup.js"></script>
</body>
</html>
